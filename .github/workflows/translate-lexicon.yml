name: Translate lexicon to Korean

on:
  schedule:
    # 07:15 UTC = shortly after Gemini's free-tier daily quota resets at
    # midnight Pacific time, so a fresh day's quota is available.
    - cron: "15 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install @google/genai
        run: npm install @google/genai --no-save

      - name: Translate today's quota worth of entries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/translate-lexicon.mjs

      - name: Commit and push if there are changes
        run: |
          if ! git diff --quiet -- public/bible-data/strongs/lexicon.ko.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/bible-data/strongs/lexicon.ko.json
            git commit -m "Translate more Strongs lexicon entries to Korean (auto)"
            git push
          else
            echo "No new translations today."
          fi
